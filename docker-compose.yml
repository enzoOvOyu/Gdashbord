# RunSun GPU Cloud 控制台 — 基础开发环境编排
#
# 服务组成：
#   frontend  前端开发容器（Node22 + pnpm + Vite6）          端口 5173
#   db        PostgreSQL 15（后端蓝图数据库底座）             端口 5432
#   adminer   轻量数据库管理 UI（可选，便于查看 schema）       端口 8081
#
# 数据与配置统一存放于本工作空间内，不依赖外部路径：
#   - 源码 / 配置：本仓库（bind mount 到 frontend 容器 /app）
#   - 数据库运行时数据：./docker/postgres/data
#   - 数据库初始化脚本：./docker/postgres/init（01-schema.sql / 02-seed.sql）
#
# 启动：  docker compose up -d
# 停止：  docker compose down
# 销毁数据：docker compose down -v   （会删除 ./docker/postgres/data）

services:
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: runsun-frontend
    environment:
      - VITE_ENABLE_MOCK=${VITE_ENABLE_MOCK:-true}
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8080}
      - VITE_DEFAULT_REGION=${VITE_DEFAULT_REGION:-jp}
      - VITE_WS_URL=${VITE_WS_URL:-}
      - VITE_POLL_INTERVAL_MS=${VITE_POLL_INTERVAL_MS:-3000}
      - VITE_FEATURE_STATUS_BAR=${VITE_FEATURE_STATUS_BAR:-true}
      - VITE_FEATURE_TOPOLOGY=${VITE_FEATURE_TOPOLOGY:-true}
      - VITE_THEME_DEFAULT=${VITE_THEME_DEFAULT:-light}
      - VITE_LOW_BALANCE_THRESHOLD_USD=${VITE_LOW_BALANCE_THRESHOLD_USD:-50}
      - VITE_MOCK_SEED=${VITE_MOCK_SEED:-20261017}
      - VITE_ENABLE_CONSISTENCY_CHECK=${VITE_ENABLE_CONSISTENCY_CHECK:-true}
      - VITE_MOCK_FAULT=${VITE_MOCK_FAULT:-}
      # 容器访问外网所需的代理：指向宿主代理（host.docker.internal 解析到宿主网关）。
      # 默认端口取自宿主代理（见 .env 的 COMPOSE_HTTP_PROXY / COMPOSE_HTTPS_PROXY）。
      # 若宿主代理端口变动，请同步修改 .env 中这两个值。
      - HTTP_PROXY=${COMPOSE_HTTP_PROXY}
      - HTTPS_PROXY=${COMPOSE_HTTPS_PROXY}
      - http_proxy=${COMPOSE_HTTP_PROXY}
      - https_proxy=${COMPOSE_HTTPS_PROXY}
      - NO_PROXY=localhost,127.0.0.1,db,adminer,host.docker.internal
      # pnpm store 指向命名卷：避免在 bind mount 的 /app 下生成 .pnpm-store
      # （曾因轮询监听扫描该目录导致 gRPC-FUSE EIO、Vite 崩溃，见 vite.config.ts）
      - npm_config_store_dir=/pnpm-store
    ports:
      # 仅发布 IPv4：Docker Desktop 同时发布 [::]:5173，IPv6 中继卡死时
      # curl/浏览器优先解析 ::1 会表现为 60s 超时（改用 127.0.0.1 访问可绕过）
      - "127.0.0.1:5173:5173"
    volumes:
      # 源码实时同步（开发热更新）
      - .:/app
      # node_modules 使用命名卷，避免 Windows 文件系统下的性能/权限问题
      - node_modules:/app/node_modules
      # pnpm 包缓存存于命名卷，避免落回 bind mount 拖垮文件监听
      - pnpm_store:/pnpm-store
    working_dir: /app
    # 容器内命名卷 node_modules 会遮蔽镜像内置依赖，故启动前在卷内再装一次（幂等、命中缓存极快）。
    # 健壮性：宿主代理端口可能变动 ⇒ 先按 .env 的代理安装；失败则尝试直连；
    # 仍失败则不以失败退出，改用卷内已有 node_modules 启动，避免 Vite 整体不可用。
    command: |-
      sh -c 'install_once() { pnpm install --prefer-offline; };
      install_once || (echo "[entrypoint] 代理不可用，尝试直连安装…" && env -u HTTP_PROXY -u HTTPS_PROXY -u http_proxy -u https_proxy pnpm install --prefer-offline) || echo "[entrypoint] 依赖安装失败：改用卷内已有 node_modules 启动，请修正 .env 代理端口后重建";
      exec pnpm dev --host 0.0.0.0 --port 5173'
    depends_on:
      - db
    networks:
      - runsun

  db:
    image: postgres:15
    container_name: runsun-db
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-runsun}
      - POSTGRES_USER=${POSTGRES_USER:-runsun}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-runsun}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # 初始化 DDL 与种子（来自 ARCHITECTURE.md §12，落于工作空间内）
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      # 运行时数据落于工作空间内（满足"数据文件统一存放"要求）
      - ./docker/postgres/data:/var/lib/postgresql/data
    networks:
      - runsun

  adminer:
    image: adminer:4
    container_name: runsun-adminer
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      - db
    networks:
      - runsun

volumes:
  node_modules:
  pnpm_store:

networks:
  runsun:
    driver: bridge
