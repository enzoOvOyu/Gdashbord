<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" font-family="-apple-system,'PingFang SC',sans-serif">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9900"/><stop offset="1" stop-color="#ff6000"/>
    </linearGradient>
  </defs>
  <rect width="840" height="360" rx="14" fill="#f6f7fb"/>
  <text x="30" y="42" font-size="20" font-weight="800" fill="#1a1c2c">RunSun Cloud · 10,016 GPU Fleet</text>
  <text x="30" y="64" font-size="11" fill="#81879a">4 Regions · 103 Clusters · 24 Tenants · Real-time Operations</text>

  <!-- KPI 卡 -->
  <g>
    <rect x="30" y="90" width="180" height="76" rx="10" fill="#fff" stroke="#e9eaf2"/>
    <text x="46" y="114" font-size="10" fill="#898ea1">TOTAL GPUS</text>
    <text x="46" y="146" font-size="24" font-weight="800" fill="#1a1c2c">10,016</text>
    <rect x="30" y="90" width="180" height="76" rx="10" fill="none" stroke="#ff6000" stroke-width="2" stroke-dasharray="6 500">
      <animate attributeName="stroke-dasharray" values="6 500;500 6;6 500" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g>
    <rect x="224" y="90" width="180" height="76" rx="10" fill="#fff" stroke="#e9eaf2"/>
    <text x="240" y="114" font-size="10" fill="#898ea1">UTILIZATION</text>
    <text x="240" y="146" font-size="24" font-weight="800" fill="#17a76f">62%</text>
  </g>
  <g>
    <rect x="418" y="90" width="180" height="76" rx="10" fill="#fff" stroke="#e9eaf2"/>
    <text x="434" y="114" font-size="10" fill="#898ea1">MRR</text>
    <text x="434" y="146" font-size="24" font-weight="800" fill="#1a1c2c">$23.6M</text>
  </g>
  <g>
    <rect x="612" y="90" width="198" height="76" rx="10" fill="#fff" stroke="#e9eaf2"/>
    <text x="628" y="114" font-size="10" fill="#898ea1">ACTIVE TENANTS</text>
    <text x="628" y="146" font-size="24" font-weight="800" fill="#1a1c2c">24</text>
  </g>

  <!-- 区域流动动画 -->
  <text x="30" y="206" font-size="11" font-weight="700" fill="#6b7085">REGIONAL CAPACITY</text>
  <g>
    <rect x="30" y="220" width="780" height="26" rx="6" fill="#f0edf9"/>
    <rect x="30" y="220" width="0" height="26" rx="6" fill="url(#g1)">
      <animate attributeName="width" values="0;539;539" dur="2.4s" fill="freeze"/>
    </rect>
    <text x="40" y="237" font-size="11" font-weight="700" fill="#fff">6,236 / 10,016 allocated (62%)</text>
  </g>

  <!-- 集群节点脉冲 -->
  <text x="30" y="286" font-size="11" font-weight="700" fill="#6b7085">CLUSTERS</text>
  <g fill="#ff6000">
    <circle cx="46" cy="312" r="5"><animate attributeName="opacity" values="1;.3;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="70" cy="312" r="5"><animate attributeName="opacity" values="1;.3;1" dur="1.6s" begin=".2s" repeatCount="indefinite"/></circle>
    <circle cx="94" cy="312" r="5"><animate attributeName="opacity" values="1;.3;1" dur="1.6s" begin=".4s" repeatCount="indefinite"/></circle>
    <circle cx="118" cy="312" r="5"><animate attributeName="opacity" values="1;.3;1" dur="1.6s" begin=".6s" repeatCount="indefinite"/></circle>
    <circle cx="142" cy="312" r="5"><animate attributeName="opacity" values="1;.3;1" dur="1.6s" begin=".8s" repeatCount="indefinite"/></circle>
    <circle cx="166" cy="312" r="5" fill="#17a76f"><animate attributeName="opacity" values="1;.3;1" dur="1.6s" begin="1s" repeatCount="indefinite"/></circle>
    <text x="186" y="316" font-size="10" fill="#81879a">103 clusters · 86 healthy · 9 degraded · 3 provisioning · 5 maintenance</text>
  </g>

  <!-- 部署进度条动画 -->
  <text x="560" y="286" font-size="11" font-weight="700" fill="#6b7085">LIVE DEPLOY</text>
  <g>
    <rect x="560" y="300" width="250" height="10" rx="5" fill="#f0edf9"/>
    <rect x="560" y="300" width="0" height="10" rx="5" fill="#17a76f">
      <animate attributeName="width" values="0;250;0" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="560" y="330" font-size="9" fill="#81879a">GB300 NVL72 rack · provisioning</text>
  </g>
</svg>
